[workspace]
members = ["kernel/forge-kernel", "arch/forge-arch-aarch64", "platforms/forge-platform-qemu-virt"]
default-members = ["kernel/forge-kernel"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
debug = 2
overflow-checks = true
